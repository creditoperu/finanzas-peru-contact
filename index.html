<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>FINANZAS CONFIABLE PERÚ | Atención al cliente</title>
  <meta name="description" content="Canal de atención de FINANZAS CONFIABLE PERÚ. Consulta información y contacta con nuestro equipo por Telegram.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 22px;
      font-family: Arial, Helvetica, sans-serif; color: #17212b;
      background: #f4f6f8;
    }
    main {
      width: 100%; max-width: 390px; text-align: center;
      background: #fff; border: 1px solid #e5e9ed; border-radius: 20px;
      padding: 32px 24px 26px; box-shadow: 0 10px 30px rgba(20,35,50,.06);
    }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 22px;
      display: grid; place-items: center; color: #fff; font-weight: 800;
      font-size: 22px; letter-spacing: -1px;
      background: linear-gradient(145deg, #b91f32 0 48%, #fff 48% 56%, #b91f32 56% 100%);
      border: 1px solid #e6e9ed;
    }
    h1 { margin: 0; font-size: 21px; line-height: 1.25; letter-spacing: .2px; }
    .eyebrow { margin: 9px 0 24px; color: #6b7785; font-size: 11px; letter-spacing: 1.5px; font-weight: 700; }
    h2 { margin: 0 0 10px; font-size: 25px; }
    p { margin: 0 0 23px; color: #586574; font-size: 15px; line-height: 1.5; }
    .telegram {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; min-height: 54px; border-radius: 12px;
      color: #fff; background: #229ed9; text-decoration: none;
      font-size: 14px; font-weight: 700; letter-spacing: .35px;
      transition: background .15s ease;
    }
    .telegram:active { background: #1688bf; }
    .telegram svg { width: 20px; height: 20px; fill: currentColor; }
    .note { margin: 17px 0 0; font-size: 12px; color: #7b8793; }
    .footer { margin-top: 25px; padding-top: 17px; border-top: 1px solid #edf0f2; color: #7b8793; font-size: 11px; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">FC</div>
    <h1>FINANZAS CONFIABLE PERÚ</h1>
    <div class="eyebrow">ATENCIÓN AL CLIENTE</div>
    <h2>¡Bienvenido!</h2>
    <p>Estamos disponibles para atender tus consultas. Continúa la conversación a través de nuestro canal de Telegram.</p>
    <a class="telegram" href="https://t.me/Finanzasconfiableperu" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 4.3 18.5 19c-.2 1- .8 1.2-1.6.8l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.8.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L7.1 13.2l-4.4-1.4c-1-.3-1-1 .2-1.5L20 3.8c.9-.3 1.9.2 1.7.5Z"/></svg>
      CONTINUAR EN TELEGRAM
    </a>
    <div class="note">Al continuar, se abrirá Telegram.</div>
    <div class="footer">Canal de contacto: @Finanzasconfiableperu</div>
  </main>
</body>
</html>
